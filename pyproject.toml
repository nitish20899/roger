[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roger-meeting-agent"
version = "0.1.0"
description = "Roger: a voice AI teammate that joins your Google Meet, Microsoft Teams and Zoom calls, listens, talks back and posts to chat."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["meeting", "bot", "voice", "agent", "elevenlabs", "google-meet", "teams", "zoom", "claude", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Conferencing",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "aiohttp>=3.10",
  "httpx>=0.27",
  "websockets>=13",
  "python-dotenv>=1.0",
  "openai>=1.50",
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
roger = "roger.cli:main"

[project.urls]
Homepage = "https://github.com/nitish20899/roger"
Issues = "https://github.com/nitish20899/roger/issues"

[tool.setuptools.packages.find]
include = ["roger*"]

[tool.setuptools.package-data]
roger = ["static/*.html", "static/orb/*", "static/orb/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
