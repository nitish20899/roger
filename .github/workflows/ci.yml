name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pyflakes
      - name: Lint
        run: python -m pyflakes roger tests
      - name: Test
        run: python -m pytest -q

  # The audio path can only really be tested in a browser. This job caught a Chrome behaviour that no
  # unit test could: a MediaStreamAudioDestinationNode at a non-native sample rate hands WebRTC silence.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Browser audio round trip
        env:
          ROGER_BROWSER_TESTS: "1"
        run: python -m pytest tests/test_browser_audio.py -q
