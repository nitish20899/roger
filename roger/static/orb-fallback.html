<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__BOT_NAME__</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; background: #0a0d10; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
</style>
</head>
<body>
<canvas id="gl" width="1280" height="720"></canvas>
<script>
(() => {
  const ORB_VERSION = "__ORB_VERSION__";
  const SR = 16000, params = new URLSearchParams(location.search), MUTE = params.get('mute') === '1';
  let state = 'connecting';

  // ---------- audio out: what the bridge sends is played here; in voice-agent mode this page IS the bot's voice
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const gain = ctx.createGain(); gain.gain.value = MUTE ? 0 : 1;
  const analyser = ctx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.5;
  gain.connect(analyser); analyser.connect(ctx.destination);
  const kick = () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); };
  setInterval(kick, 500); document.addEventListener('click', kick);
  let nextTime = 0; const sources = new Set(); const JITTER = 0.12;
  function playPCM(b64) {
    const bin = atob(b64); const n = bin.length >> 1; if (!n) return;
    const buf = ctx.createBuffer(1, n, SR), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 0x8000) v -= 0x10000; ch[i] = v / 32768; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(gain);
    const start = Math.max(ctx.currentTime + JITTER, nextTime); src.start(start); nextTime = start + buf.duration;
    sources.add(src); src.onended = () => sources.delete(src);
  }
  function stopAll() { sources.forEach(s => { try { s.stop(); } catch (e) {} }); sources.clear(); nextTime = 0; }

  // ---------- bridge connection (audio, state, version check)
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/monitor'); window.__ws = ws;
    ws.onopen = () => { state = 'listening'; ws.send(JSON.stringify({ type: 'hello', version: ORB_VERSION, webgl: !!window.__gl_ok, ua: navigator.userAgent })); };
    ws.onmessage = (e) => {
      if (e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'audio') playPCM(m.pcm);
      else if (m.type === 'stop') stopAll();
      else if (m.type === 'state') state = m.state;
      else if (m.type === 'orb_version' && m.v && m.v !== ORB_VERSION) location.reload();  // pick up new visuals without a rejoin
    };
    ws.onclose = () => { state = 'reconnecting'; setTimeout(connect, 1500); };
    ws.onerror = () => ws.close();
  }
  connect();

  // ---------- microphone = the meeting audio (voice-agent mode); forwarded to the bridge as a transcription fallback
  if (params.get('mic') === '1' && navigator.mediaDevices) {
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(stream => {
      const cap = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
      const src = cap.createMediaStreamSource(stream), proc = cap.createScriptProcessor(2048, 1, 1);
      src.connect(proc); proc.connect(cap.destination);
      proc.onaudioprocess = (e) => {
        const f = e.inputBuffer.getChannelData(0), step = cap.sampleRate / SR, n = Math.floor(f.length / step), out = new Int16Array(n);
        for (let i = 0; i < n; i++) { const v = Math.max(-1, Math.min(1, f[Math.floor(i * step)])); out[i] = v < 0 ? v * 0x8000 : v * 0x7fff; }
        let bin = ''; const bytes = new Uint8Array(out.buffer); for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        if (window.__ws && window.__ws.readyState === 1) window.__ws.send(JSON.stringify({ type: 'mic', pcm: btoa(bin) }));
      };
    }).catch(err => console.log('mic unavailable', err));
  }

  // ---------- the orb (WebGL): a shaded sphere with slowly drifting warm color fields, driven by the voice
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false, premultipliedAlpha: false });
  const td = new Uint8Array(analyser.fftSize);
  let level = 0, pulse = 0;
  const PAL = {  // four colors: highlight, mid, deep, shadow  (all as 0..1 rgb)
    speaking:  [[1.00, 0.88, 0.72], [1.00, 0.62, 0.38], [0.86, 0.33, 0.22], [0.42, 0.10, 0.07]],
    listening: [[0.99, 0.84, 0.68], [0.95, 0.56, 0.35], [0.76, 0.30, 0.21], [0.33, 0.09, 0.07]],
    thinking:  [[0.86, 0.96, 0.94], [0.45, 0.78, 0.76], [0.18, 0.52, 0.54], [0.06, 0.20, 0.23]],
    connecting:[[0.80, 0.83, 0.83], [0.56, 0.62, 0.63], [0.30, 0.35, 0.36], [0.10, 0.13, 0.14]],
  };
  PAL.reconnecting = PAL.connecting;
  const cur = PAL.listening.map(c => c.slice());

  window.__gl_ok = !!gl; if (window.__ws && window.__ws.readyState === 1) window.__ws.send(JSON.stringify({ type: 'hello', version: ORB_VERSION, webgl: !!gl, ua: navigator.userAgent }));
  if (!gl) { fallback2D(); return; }

  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `
    precision highp float;
    uniform vec2 res; uniform float t, level, pulse; uniform vec3 c0, c1, c2, c3;
    // value noise + fbm
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.03+vec2(7.3,1.7); a*=.5;} return v; }
    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5*res) / res.y;      // centered, y in [-0.5,0.5]
      uv.y += 0.02;
      float R = 0.30 + 0.012*pulse;                        // sphere radius
      float ang = atan(uv.y, uv.x);
      float wob = 0.006*sin(3.*ang + t*0.7) + 0.004*sin(5.*ang - t*1.1) + level*0.014*sin(8.*ang + t*5.0);
      float r = length(uv) / (R + wob);
      // background: near-black with a faint warm glow around the orb
      vec3 bg = vec3(0.039,0.051,0.063) + c2 * 0.10 * exp(-max(r-1.0,0.)*2.2) * (0.6+0.8*level);
      float edge = smoothstep(1.0, 0.992, r);              // anti-aliased rim
      if (edge <= 0.0) { gl_FragColor = vec4(bg,1.); return; }
      float z = sqrt(max(0., 1. - r*r));                   // sphere depth
      vec3 n = normalize(vec3(uv / (R+wob), z));
      // drifting color fields inside the sphere (domain-warped noise on the sphere surface)
      vec2 q = vec2(n.x, n.y) * 1.6 + vec2(0.15*t, -0.09*t);
      float w1 = fbm(q + vec2(0.0, 0.0));
      float w2 = fbm(q * 1.7 + vec2(2.1*w1, -1.3*w1) + vec2(-0.07*t, 0.11*t));
      float m = clamp(0.35*w1 + 0.65*w2 + 0.10*level*sin(t*6.+ang*3.), 0., 1.);
      vec3 col = mix(c3, c2, smoothstep(0.15, 0.45, m));
      col = mix(col, c1, smoothstep(0.42, 0.68, m));
      col = mix(col, c0, smoothstep(0.66, 0.92, m));
      // lighting: soft key light from upper-left, gentle wrap, small specular
      vec3 L = normalize(vec3(-0.55, 0.65, 0.55));
      float diff = clamp(dot(n, L), 0., 1.);
      float wrap = clamp(dot(n, L)*0.5+0.5, 0., 1.);
      float spec = pow(clamp(dot(reflect(-L, n), vec3(0.,0.,1.)), 0., 1.), 40.0) * 0.18;
      float rim = pow(1.0 - z, 3.0);
      col = col * (0.42 + 0.58*wrap) + col * diff * 0.25 + vec3(spec) + c0 * rim * 0.10;
      col *= 1.0 + 0.22*level;                             // brighten with the voice
      col = mix(col, col*col*1.15, 0.15);                  // a little contrast
      col += (hash(gl_FragCoord.xy + t) - 0.5) * 0.012;    // fine grain against banding
      gl_FragColor = vec4(mix(bg, col, edge), 1.);
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.log(gl.getShaderInfoLog(s)); return s; }
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; for (const u of ['res','t','level','pulse','c0','c1','c2','c3']) U[u] = gl.getUniformLocation(prog, u);
  gl.viewport(0, 0, canvas.width, canvas.height);

  let t0 = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const t = (now - t0) / 1000;
    analyser.getByteTimeDomainData(td);
    let sum = 0; for (let i = 0; i < td.length; i++) { const v = (td[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / td.length);
    const target = state === 'speaking' ? Math.min(1, rms * 6.0) : (state === 'thinking' ? 0.10 + 0.06 * Math.sin(t * 4.5) : 0.03 + 0.02 * Math.sin(t * 1.1));
    level += (target - level) * (target > level ? 0.4 : 0.07);
    pulse += ((state === 'speaking' ? 1 : 0) - pulse) * 0.08;
    const pal = PAL[state] || PAL.listening;
    for (let i = 0; i < 4; i++) for (let k = 0; k < 3; k++) cur[i][k] += (pal[i][k] - cur[i][k]) * 0.05;  // smooth color transitions
    gl.uniform2f(U.res, canvas.width, canvas.height); gl.uniform1f(U.t, t); gl.uniform1f(U.level, level); gl.uniform1f(U.pulse, pulse);
    gl.uniform3fv(U.c0, cur[0]); gl.uniform3fv(U.c1, cur[1]); gl.uniform3fv(U.c2, cur[2]); gl.uniform3fv(U.c3, cur[3]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(frame);

  function fallback2D() {  // no WebGL: a plain shaded sphere that still pulses
    const g = canvas.getContext('2d'); const W = canvas.width, H = canvas.height;
    function draw() { requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(td); let s = 0; for (let i = 0; i < td.length; i++) { const v = (td[i]-128)/128; s += v*v; }
      const lv = state === 'speaking' ? Math.min(1, Math.sqrt(s/td.length)*6) : 0.05;
      const R = 200 * (1 + 0.06*lv); g.fillStyle = '#0a0d10'; g.fillRect(0,0,W,H);
      const gr = g.createRadialGradient(W/2-70, H/2-80, 10, W/2, H/2, R); gr.addColorStop(0,'#ffe0b8'); gr.addColorStop(.5,'#ff8f4d'); gr.addColorStop(.85,'#c94a30'); gr.addColorStop(1,'#4a1810');
      g.fillStyle = gr; g.beginPath(); g.arc(W/2, H/2, R, 0, 6.29); g.fill(); }
    draw();
  }
})();
</script>
</body>
</html>
